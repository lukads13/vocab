<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<title>Vokabeltrainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --ink:#18181C; --muted:#5C5D66; --line:#E3E1DA; --line2:#ECEAE4;
  --accent:#3442C4; --accent-soft:#E7E9FB; --accent-ink:#2A35A0;
  --amber:#F2B441; --new-bg:#FCEFD2; --new-fg:#6B4500; --ok-bg:#DCF0E3; --ok-fg:#1D5E38;
  --dark:#18181C; --dark2:#26262C; --dark3:#3A3A42; --dark-muted:#B4B4BC;
  --good:#5FD08F; --bad:#FF8A7A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;padding:calc(env(safe-area-inset-top) + 20px) 20px 180px}
.fab{position:fixed;z-index:6;right:max(16px, calc((100vw - 480px)/2 + 16px));bottom:calc(env(safe-area-inset-bottom) + 96px);width:60px;height:60px;border-radius:20px;border:none;background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(52,66,196,.35);display:flex;align-items:center;justify-content:center}
.fab[hidden]{display:none}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px}
.choices button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tin{height:56px;border-radius:16px;border:1.5px solid var(--dark3);background:var(--dark2);color:#fff;font-size:18px;padding:0 16px;width:100%}
.tin:focus{outline:2px solid var(--amber);outline-offset:1px}
.listen{width:120px;height:120px;border-radius:60px;border:none;background:var(--amber);color:var(--ink);display:flex;align-items:center;justify-content:center;margin:8px auto}
.zettel{position:relative;background:#fff;color:var(--ink);border-radius:28px;min-height:360px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .2s;cursor:grab}
.zettel.drag{transition:none}
.zettel .stamp{position:absolute;top:20px;padding:8px 16px;border-radius:14px;font-weight:900;font-size:26px;letter-spacing:1px;text-transform:uppercase;opacity:0;border:4px solid;background:#fff}
.zettel .stamp.ok{left:18px;color:#1D5E38;border-color:#1D5E38;transform:rotate(-10deg)}
.zettel .stamp.no{right:18px;color:#B4510A;border-color:#B4510A;transform:rotate(10deg)}
.btn.again{background:#4A2C0B;border:1.5px solid #FF9F45;color:#fff}
.modal{position:fixed;inset:0;z-index:25;background:rgba(24,24,28,.45);overflow-y:auto}
.modal[hidden]{display:none}
.mbox{width:calc(100% - 24px);max-width:456px;margin:calc(env(safe-area-inset-top) + 16px) auto 24px;background:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px}
.bkin{height:64px!important;min-height:64px!important;overflow:hidden;resize:none;font-size:12px!important;line-height:1.35;color:var(--muted)!important;font-family:ui-monospace,monospace}
.okline{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:10px 12px;border-radius:12px}
.okline.ok{background:var(--ok-bg);color:var(--ok-fg)} .okline.bad{background:#FBE3DF;color:#8E2418}
.shareimg{width:100%;max-height:42vh;object-fit:contain;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.wordrow{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.wordrow.sel{background:var(--accent-soft);border-color:var(--accent)}
.check{flex:none;width:26px;height:26px;border-radius:13px;border:2px solid #B9B7AF;display:flex;align-items:center;justify-content:center;color:#fff}
.wordrow.sel .check{background:var(--accent);border-color:var(--accent)}
.selhead{position:sticky;top:0;z-index:4;margin:calc(-1 * (env(safe-area-inset-top) + 20px)) -20px 0;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;background:var(--bg);display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.selbar{position:fixed;left:0;right:0;z-index:7;bottom:calc(env(safe-area-inset-bottom) + 78px);padding:0 12px}
.selbar[hidden]{display:none}
.selbar .in{max-width:456px;margin:0 auto;background:var(--ink);color:#fff;border-radius:22px;padding:6px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.selbar button{border:none;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:8px 0;border-radius:16px}
.selbar button:disabled{opacity:.4}
.selbar button.arm{background:#8E2418}
.pbar{height:6px;border-radius:3px;background:var(--dark3);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--amber)}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.5px}
h2{margin:0;font-size:18px;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:700}
.stat span{font-size:12px;color:var(--muted)}
.hero{background:var(--accent);color:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero .big{font-size:20px;font-weight:600;line-height:1.3}
.bolt{width:32px;height:32px;border-radius:16px;background:var(--amber);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.label{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.btn{height:48px;padding:0 18px;border-radius:24px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:15px}
.btn.full{width:100%}
.btn.white{background:#fff;color:var(--ink)}
.btn.ghost{background:transparent;border:1.5px solid currentColor}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.amber{background:var(--amber);color:var(--ink);font-weight:700}
.btn.danger{background:#fff;color:#A3271A;border:1px solid #E8C3BD}
.btn:disabled{opacity:.5}
.link{border:none;background:transparent;color:var(--accent);font-weight:600;font-size:14px;min-height:44px;padding:0 4px}
.back{border:none;background:transparent;font-weight:600;font-size:15px;min-height:44px;display:flex;align-items:center;gap:4px;padding:0 8px 0 0}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--bg);color:#3A3B42}
.chip.new{background:var(--new-bg);color:var(--new-fg)}
.chip.learn{background:var(--accent-soft);color:var(--accent-ink)}
.chip.sure{background:var(--ok-bg);color:var(--ok-fg)}
.tchip{padding:8px 14px;border-radius:16px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:16px}
.ochip{padding:6px 12px;border-radius:14px;border:1px solid var(--line);font-size:14px}
.pill{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:14px}
.wordrow{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;border:1px solid var(--line);background:var(--surface)}
.wordrow .w{font-size:16px;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{height:44px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.filters{display:flex;gap:8px;overflow-x:auto}
.filters button{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:#3A3B42}
.input{height:52px;padding:0 16px;border-radius:16px;border:1.5px solid #CFCDC5;background:#fff;font-size:17px;width:100%;min-width:0}
textarea.input{height:auto;min-height:72px;padding:12px 16px;font-size:15px;line-height:1.45;resize:vertical}
.input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;border:none;background:transparent;font-size:15px;outline:none;color:var(--ink);min-width:0}
.ctx{background:var(--bg);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.setrow:last-child{border-bottom:none}
.switch{flex:none;width:52px;height:32px;border-radius:16px;border:none;background:#B9B7AF;padding:4px;display:flex}
.switch span{width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--accent)}
.switch[aria-pressed="true"] span{transform:translateX(20px)}
.timegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.timegrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.timein{width:100%;min-width:0;height:40px;border-radius:12px;border:1.5px solid var(--line);padding:0 10px;font-size:15px;font-weight:600;color:var(--ink);background:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom) + 12px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
nav.tabs button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0}
nav.tabs button span{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] span{background:var(--accent-soft)}
nav.tabs .dot{position:absolute;top:3px;right:12px;width:10px;height:10px;border-radius:5px;background:#E07A1F;border:2px solid #fff}

.overlay{position:fixed;inset:0;z-index:20;background:var(--dark);color:#fff;overflow-y:auto}
.overlay .in{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--dark3)}
.dots i.done{background:var(--amber)} .dots i.cur{background:#fff}
.qkind{padding:4px 10px;border-radius:12px;background:#2E2E36;font-size:12px;font-weight:600;color:var(--amber)}
.qprompt{font-size:40px;font-weight:700;line-height:1.15;letter-spacing:-.5px;word-break:break-word}
.qprompt.long{font-size:24px;line-height:1.35}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:12px 18px;border-radius:18px;border:1.5px solid var(--dark3);background:var(--dark2);color:#fff;font-size:17px;font-weight:500;text-align:left;width:100%}
.opt.right{background:#1E4A31;border-color:var(--good)}
.opt.wrong{background:#57211C;border-color:var(--bad)}
.opt.dim{opacity:.5}
.fb{background:var(--dark2);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ring{width:120px;height:120px;border-radius:60px;border:6px solid var(--amber);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;margin:0 auto}
.resrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--dark3)}
.resrow:last-child{border-bottom:none}

#banner{position:fixed;inset:0;z-index:15;background:rgba(24,24,28,.35);display:none}
#banner.show{display:block}
#banner .box{max-width:456px;margin:calc(env(safe-area-inset-top) + 16px) auto 0;width:calc(100% - 24px);background:#fff;border-radius:28px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.22);display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 176px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <main id="main" tabindex="-1"></main>
</div>

<nav class="tabs" aria-label="Hauptnavigation"><div class="in" id="tabs"></div></nav>
<button id="fab" class="fab" data-act="go" data-to="add" aria-label="Vokabel hinzufügen" hidden><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div id="banner" role="alertdialog" aria-label="Spontan-Test"></div>
<div id="selbar" class="selbar" hidden><div class="in" id="selbarIn"></div></div>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="build-info.js"></script>
<script>
'use strict';
/* ============ Icons ============ */
const I = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  list:'<path d="M4 5h16M4 12h16M4 19h10"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  gear:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  bolt:'<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  speaker:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
  share:'<path d="M4 13v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6M12 3v12M7 8l5-5 5 5"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  cards:'<rect x="4" y="6" width="13" height="15" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/>'
};
const ico = (n, s=22, extra='') => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ${extra}>${I[n]}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ Daten ============ */
const KEY = 'vokabeltrainer.v1';
const DEFAULTS = { freq:4, start:'08:00', end:'21:00', perTest:3, dir:'mix', notify:false, weak:true };
function fresh(){ return { words:[], settings:{...DEFAULTS}, schedule:null, stats:{streak:0,lastDay:null,today:{date:null,count:0}} }; }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && Array.isArray(d.words)){ d.settings = {...DEFAULTS, ...(d.settings||{})}; d.stats = d.stats || fresh().stats; return d; }
  }catch(e){}
  return fresh();
}
let db = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Speichern fehlgeschlagen'); } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const POS = {noun:'Nomen',verb:'Verb',adjective:'Adjektiv',adverb:'Adverb',pronoun:'Pronomen',preposition:'Präposition',conjunction:'Konjunktion',interjection:'Interjektion',exclamation:'Ausruf',determiner:'Artikel'};
const SAMPLES = [
  {en:'reluctant',ipa:'/rɪˈlʌktənt/',pos:'Adjektiv',de:['widerwillig','zögernd'],def:'Unwilling and hesitant to do something.',ex:'He was reluctant to admit his mistake.',exDe:'Er gab seinen Fehler nur widerwillig zu.',syn:['unwilling','hesitant']},
  {en:'casual',ipa:'/ˈkæʒuəl/',pos:'Adjektiv',de:['beiläufig','lässig','zwanglos'],def:'Relaxed and not very serious; happening without planning.',ex:'It was just a casual remark.',exDe:'Es war nur eine beiläufige Bemerkung.',syn:['relaxed','informal']},
  {en:'wistful',ipa:'/ˈwɪstfəl/',pos:'Adjektiv',de:['wehmütig','sehnsüchtig'],def:'Showing a gentle, slightly sad longing for something.',ex:'She gave a wistful smile and looked out of the window.',exDe:'Sie lächelte wehmütig und sah aus dem Fenster.',syn:['nostalgic','longing']},
  {en:'thorough',ipa:'/ˈθʌrə/',pos:'Adjektiv',de:['gründlich','sorgfältig'],def:'Done carefully and completely, paying attention to every detail.',ex:'The police carried out a thorough search.',exDe:'Die Polizei führte eine gründliche Durchsuchung durch.',syn:['careful','meticulous']},
  {en:'to cope',ipa:'/kəʊp/',pos:'Verb',de:['zurechtkommen','bewältigen'],def:'To deal successfully with something difficult.',ex:'She coped well with the pressure at work.',exDe:'Sie kam gut mit dem Druck in der Arbeit zurecht.',syn:['manage','handle']},
  {en:'sturdy',ipa:'/ˈstɜːdi/',pos:'Adjektiv',de:['stabil','robust'],def:'Strong and solidly built; not easily damaged.',ex:'We need a sturdy table for the workshop.',exDe:'Wir brauchen einen stabilen Tisch für die Werkstatt.',syn:['solid','robust']},
  {en:'eager',ipa:'/ˈiːɡə/',pos:'Adjektiv',de:['eifrig','begierig'],def:'Wanting very much to do or have something.',ex:'The new team members were eager to learn.',exDe:'Die neuen Teammitglieder wollten unbedingt dazulernen.',syn:['keen','enthusiastic']}
];
function makeWord(o){ return { id:uid(), en:o.en.trim(), de:(o.de||[]).filter(Boolean), ipa:o.ipa||'', pos:o.pos||'', def:o.def||'', defs:o.defs||[], ex:o.ex||'', exDe:o.exDe||'', syn:o.syn||[], audio:o.audio||'', box:0, right:0, wrong:0, tested:0, lastTested:0, created:Date.now() }; }
function findWord(en){ const k = norm(en); return db.words.find(w => norm(w.en) === k); }
function norm(s){ return String(s||'').trim().toLowerCase().replace(/^to\s+/,''); }
function status(w){ if(!w.tested) return ['Neu','new']; return w.box >= 4 ? ['Sicher','sure'] : ['Lernend','learn']; }

/* ============ Zeit ============ */
const pad = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toMin = t => { const [h,m] = String(t).split(':').map(Number); return (h||0)*60 + (m||0); };
const hhmm = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const DAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

/* Zufällige Testzeiten pro Tag. In der Android-App werden sie mehrere Tage im Voraus
   als Benachrichtigungen eingeplant, deshalb liegen sie pro Datum in db.plan. */
function dayStart(offset=0){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate() + offset); }
function genTimes(date){
  const s = db.settings, base = date.getTime();
  let a = toMin(s.start), b = toMin(s.end); if(b <= a) b = a + 60;
  const slot = (b - a) / s.freq, times = [];
  for(let i=0;i<s.freq;i++){ const m = a + i*slot + slot*0.1 + Math.random()*slot*0.8; times.push(base + Math.round(m)*60000); }
  return times;
}
function planFor(offset){
  const d = dayStart(offset), k = dayKey(d);
  db.plan = db.plan || {};
  if(!db.plan[k]){ const times = genTimes(d); db.plan[k] = { times, done: offset === 0 ? times.filter(t => t <= Date.now()) : [] }; }  // verpasste Zeiten von heute nicht nachholen
  return db.plan[k];
}
function S(){ return planFor(0); }
function buildSchedule(){  // nach Änderungen: heute und die kommenden Tage neu würfeln
  db.plan = {}; planFor(0); save(); syncNotifications();
}
function ensureSchedule(){
  const keep = new Set([0,1,2,3,4,5,6,7].map(o => dayKey(dayStart(o))));
  const had = !!(db.plan && db.plan[dayKey()]);
  S(); Object.keys(db.plan).forEach(k => { if(!keep.has(k)) delete db.plan[k]; });
  if(!had) save();
}
function nextTest(){ ensureSchedule(); const n = Date.now(), sc = S(); return sc.times.filter(t => t > n && !sc.done.includes(t)).sort((x,y)=>x-y)[0] || null; }

const BUILD = window.BUILD_INFO || { version:'dev', repo:'lukads13/vocab', token:'' };

const verNum = v => { const m = String(v||'').match(/(\d+)\.(\d+)\.(\d+)/); return m ? [+m[1], +m[2], +m[3]] : null; };
const isNewer = (a, b) => { for(let i=0;i<3;i++) if(a[i] !== b[i]) return a[i] > b[i]; return false; };
async function loadVersion(){ if(APP){ try{ const i = await APP.getInfo(); if(i && i.version) appVersion = i.version; }catch(e){} } return appVersion; }
function updateAvailable(){
  const u = db.update, cur = verNum(appVersion), lat = u && verNum(u.latest);
  return !!(cur && lat && isNewer(lat, cur));
}
async function checkUpdate(manual){
  if(ui.upd === 'checking') return;
  ui.upd = 'checking'; if(manual && !ui.quiz) render();
  try{
    const headers = { Accept:'application/vnd.github+json' };
    if(BUILD.token) headers.Authorization = 'Bearer ' + BUILD.token;
    const r = await fetch(`https://api.github.com/repos/${BUILD.repo}/releases/latest`, { headers, cache:'no-store' });
    if([401,403,404].includes(r.status)) throw { code:'noaccess' };
    if(!r.ok) throw { code:'net' };
    const j = await r.json();
    const apk = (j.assets||[]).find(a => /\.apk$/i.test(a.name));
    db.update = { ...(db.update||{}), lastCheck:Date.now(), latest:String(j.tag_name||'').replace(/^v/,''),
      apk: apk && !BUILD.token ? apk.browser_download_url : '', url: (!BUILD.token && apk) ? apk.browser_download_url : j.html_url, page:j.html_url, notes: String(j.body||'') };
    save();
    await loadVersion();
    ui.upd = updateAvailable() ? 'available' : verNum(appVersion) ? 'current' : 'dev';
    if(manual && ui.upd === 'current') toast('Du hast die neueste Version');
    if(ui.upd === 'available' && (manual || (!ui.quiz && !ui.cards && document.getElementById('modal').hidden))) showUpdateModal();
  }catch(e){
    ui.upd = e && e.code === 'noaccess' ? 'noaccess' : 'error';
    if(manual) toast(ui.upd === 'noaccess' ? 'Kein Zugriff auf die GitHub-Releases' : 'Update-Prüfung fehlgeschlagen – Internet?');
  }
  if(!ui.quiz) render();
}

/* „Was ist neu“: die ersten 2–3 Punkte aus dem Release-Text */
function whatsNew(body){
  const lines = String(body||'').split(/\r?\n/), out = []; let cur = null;
  for(const l of lines){
    if(/^\s*---/.test(l)) break;
    if(/^\s*[-•*]\s+/.test(l)){ if(cur) out.push(cur); cur = l.replace(/^\s*[-•*]\s+/, '').trim(); }
    else if(cur && /^\s{2,}\S/.test(l)) cur += ' ' + l.trim();
    else if(cur){ out.push(cur); cur = null; }
  }
  if(cur) out.push(cur);
  if(!out.length){ const t = lines.map(x => x.trim()).find(Boolean); if(t && !/^APK am Handy/i.test(t)) out.push(t); }
  return out.slice(0, 3).map(x => x.length > 110 ? x.slice(0, 107) + '…' : x);
}

async function startInstall(){
  const u = db.update || {};
  if(!UPD || !u.apk){ closeModal(); openUrl(u.apk || u.page); return; }   // Rückfall: Download im Browser
  ui.updState = { s:'download', pct:0 }; renderUpdate();
  let h = null;
  try{ h = await UPD.addListener('progress', e => {
    ui.updState.pct = e.percent;
    const b = document.getElementById('updBar'), t = document.getElementById('updPct');
    if(b) b.style.width = e.percent + '%'; if(t) t.textContent = e.percent + ' %';
  }); }catch(_){}
  try{ const r = await UPD.download({ url:u.apk }); ui.updPath = r.path; }
  catch(e){ ui.updState = { s:'error', msg:'Download fehlgeschlagen – Internet?' }; renderUpdate(); return; }
  finally{ try{ h && h.remove && h.remove(); }catch(_){} }
  await doInstall();
}
async function doInstall(){
  try{
    const r = await UPD.install({ path: ui.updPath });
    ui.updState = r && r.needsPermission ? { s:'perm' } : { s:'started' };
  }catch(e){ ui.updState = { s:'error', msg:'Installation konnte nicht gestartet werden' }; }
  renderUpdate();
}
async function resumeInstall(){   // zurück aus den Einstellungen: Erlaubnis da → weiter
  if(!UPD || !ui.updState || ui.updState.s !== 'perm' || ui.modal !== 'update') return;
  try{ const r = await UPD.canInstall(); if(r && r.allowed) await doInstall(); }catch(_){}
}

function afterUpdateNotice(){
  if(!NATIVE || !verNum(appVersion)) return;
  db.update = db.update || {};
  const last = db.update.lastVersion;
  if(last && verNum(last) && isNewer(verNum(appVersion), verNum(last))) setTimeout(() => toast(`Update auf ${appVersion} installiert ✓`, 4000), 600);
  if(last !== appVersion){ db.update.lastVersion = appVersion; save(); }
}
function openUrl(url){ if(url) window.location.href = url; }  // in der Android-App öffnet das den Browser
async function nativePermission(ask){
  if(!LN) return 'denied';
  try{ let p = await LN.checkPermissions(); if(p.display !== 'granted' && ask) p = await LN.requestPermissions(); return p.display; }catch(e){ return 'denied'; }
}
let syncing = Promise.resolve();
function syncNotifications(){ syncing = syncing.then(doSync).catch(() => {}); return syncing; }
let appVisible = true;   // in der Android-App: true, solange die App im Vordergrund ist
async function doSync(){
  if(!LN) return;
  const pending = await LN.getPending().catch(() => ({notifications:[]}));
  if(pending.notifications && pending.notifications.length) await LN.cancel({notifications: pending.notifications.map(n => ({id:n.id}))});
  if(appVisible) return;   // App offen: keine Benachrichtigungen – werden beim Verlassen wieder eingeplant
  if(!db.settings.notify || !db.words.length) return;
  if(await nativePermission(false) !== 'granted') return;
  const now = Date.now(), list = [];
  for(let o = 0; o < 7; o++){
    const p = planFor(o);
    p.times.filter(t => t > now && !p.done.includes(t)).forEach(t => list.push(t));
  }
  if(db.snoozeAt && db.snoozeAt > now) list.push(db.snoozeAt);
  save();
  const n = Math.min(db.settings.perTest, db.words.length);
  await LN.schedule({ notifications: list.map(t => ({
    id: Math.floor(t / 60000) % 2000000000,
    title: 'Spontan-Test! Weißt du’s noch?',
    body: `${n} Wörter warten auf dich – dauert ca. 1 Minute.`,
    schedule: { at: new Date(t), allowWhileIdle: true },
    extra: { quiz: true }
  })) });
}

/* ============ Nachschlagen ============ */
async function fetchJSON(url, ms=9000){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try{ const r = await fetch(url, {signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function translate(text, pair='en|de'){
  const j = await fetchJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${pair}`);
  if(!j || (j.responseStatus && Number(j.responseStatus) !== 200)) throw new Error('mm');
  const out = [], seen = new Set(), add = s => {
    s = String(s||'').trim().replace(/[.!]+$/,''); const k = s.toLowerCase();
    if(!s || /MYMEMORY|QUERY LENGTH/i.test(s) || seen.has(k) || k === text.toLowerCase()) return; seen.add(k); out.push(s);
  };
  add(j.responseData && j.responseData.translatedText);
  (j.matches||[]).filter(m => Number(m.quality||0) >= 50 || m.quality === undefined).forEach(m => add(m.translation));
  return out;
}
// Deutsch → Englisch: Kandidaten für das englische Wort
async function englishFor(german){
  let out = [];
  try{ out = await translate(german, 'de|en'); }catch(e){}
  const seen = new Set();
  return out.map(x => x.replace(/^(the|a|an)\s+/i, '').replace(/^[A-Z](?=[a-z])/, c => c.toLowerCase()).trim())
    .filter(x => x && x.length <= 40 && !seen.has(x.toLowerCase()) && seen.add(x.toLowerCase())).slice(0, 5);
}
const uniqI = arr => { const seen = new Set(); return arr.filter(x => x && !seen.has(x.toLowerCase()) && seen.add(x.toLowerCase())); };
const emptyData = en => ({ en, de:[], ipa:'', pos:'', def:'', defs:[], ex:'', exDe:'', syn:[], audio:'' });
const NO_EN = 'Keine englische Übersetzung gefunden – trag das englische Wort selbst ein.';
function inLang(){ return db.settings.inLang === 'de' ? 'de' : 'en'; }
function findByGerman(g){ const k = String(g||'').trim().toLowerCase(); return db.words.find(w => w.de.some(x => x.toLowerCase() === k)); }
async function lookupData(word){
  const base = word.toLowerCase().replace(/^to\s+/,'');
  const [dict, tr] = await Promise.allSettled([
    fetchJSON(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(base)}`),
    translate(word)
  ]);
  const d = { en:word, de:[], ipa:'', pos:'', def:'', defs:[], ex:'', exDe:'', syn:[], audio:'' };
  let note = '';
  if(dict.status === 'fulfilled' && Array.isArray(dict.value)){
    const E = dict.value;
    for(const e of E){ if(!d.ipa) d.ipa = e.phonetic || ((e.phonetics||[]).find(p => p.text)||{}).text || ''; if(!d.audio) d.audio = ((e.phonetics||[]).find(p => p.audio)||{}).audio || ''; }
    const syn = new Set();
    for(const e of E) for(const m of (e.meanings||[])){
      const pos = POS[m.partOfSpeech] || m.partOfSpeech || '';
      if(!d.pos) d.pos = pos;
      (m.synonyms||[]).forEach(s => syn.add(s));
      for(const df of (m.definitions||[])){
        if(d.defs.length < 3 && !d.defs.some(x => x.pos === pos)) d.defs.push({pos, def:df.definition});
        if(!d.ex && df.example) d.ex = df.example;
        (df.synonyms||[]).forEach(s => syn.add(s));
      }
    }
    if(!d.defs.length){ const m = (E[0].meanings||[])[0]; if(m && m.definitions[0]) d.defs.push({pos:d.pos, def:m.definitions[0].definition}); }
    d.def = d.defs[0] ? d.defs[0].def : '';
    d.syn = [...syn].slice(0,6);
    if(d.pos === 'Verb' && !/^to\s/i.test(d.en) && d.defs.length === 1) d.en = d.en; // Schreibweise lassen, wie eingegeben
  }
  if(tr.status === 'fulfilled') d.de = tr.value.slice(0,4);
  if(d.ex){ try{ d.exDe = (await translate(d.ex))[0] || ''; }catch(e){} }
  const offline = dict.status === 'rejected' && tr.status === 'rejected' && !navigator.onLine;
  if(offline) note = 'Keine Internetverbindung – trag die Übersetzung selbst ein, das Wort wird trotzdem gespeichert.';
  else if(dict.status === 'rejected' && !d.de.length) note = 'Nichts gefunden. Stimmt die Schreibweise? Du kannst die Übersetzung auch selbst eintragen.';
  else if(dict.status === 'rejected') note = 'Kein Wörterbuch-Eintrag gefunden (z. B. bei Redewendungen) – die Übersetzung ist trotzdem da.';
  return { d, note };
}
async function doLookupDe(word, enChoice){
  const prev = ui.lookup;
  const alts = enChoice && prev ? prev.alts : null;
  ui.lookup = { status:'loading', word, lang:'de', alts }; render();
  const cands = alts || await englishFor(word);
  const en = enChoice || cands[0];
  let d, note = '';
  if(!en){ d = emptyData(''); note = NO_EN; }
  else ({ d, note } = await lookupData(en));
  d.de = uniqI([word, ...d.de]).slice(0, 4);
  if(!ui.lookup || ui.lookup.word !== word) return;
  ui.lookup = { status:'done', word, lang:'de', alts:cands, data:d, note };
  if(ui.screen === 'add') render();
}
async function doLookup(raw){
  const word = raw.trim().replace(/\s+/g,' ');
  if(!word) return;
  if(inLang() === 'de') return doLookupDe(word);
  ui.lookup = {status:'loading', word}; render();
  const { d, note } = await lookupData(word);
  if(!ui.lookup || ui.lookup.word !== word) return;
  ui.lookup = {status:'done', word, data:d, note};
  if(ui.screen === 'add') render();
}

/* ============ Liste einfügen → Vorschläge prüfen ============ */
const QMAX = 100;
function parseList(text){
  // Trennzeichen zwischen Englisch und eigener deutscher Übersetzung:
  // „ – “ / „ - “ / „ = “ (mit Leerzeichen), „/“ (mit oder ohne Leerzeichen), „: “ oder Tabulator
  const sep = /\t|\s[-–=]\s|\s*\/\s*|\s*:\s+/;
  let lines = String(text||'').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  // Geteilte Liste aus der App: nur die Zeilen mit • sind Vokabeln (Überschrift, Beispielsätze, Hinweis ignorieren)
  if(lines.filter(l => /^•\s*\S/.test(l)).length) lines = lines.filter(l => /^•\s*\S/.test(l));
  if(lines.length === 1){
    const chunks = lines[0].split(/[,;]/).map(l => l.trim()).filter(Boolean);
    const withSep = chunks.filter(c => sep.test(c)).length;
    // eine Zeile: „happy, sad“ → zwei Wörter; „happy/froh, sad/traurig“ → zwei Paare;
    // „sturdy – stabil, robust“ → ein Wort mit zwei Übersetzungen
    if(withSep === 0 || (chunks.length > 1 && withSep === chunks.length)) lines = chunks;
  }
  return lines.map(l => {
    l = l.replace(/^[-*•·\d.)\s]+(?=\S)/, '');           // Aufzählungszeichen / Nummern vorne weg

        ? (answered ? `<h2 class="qprompt">${esc(q.prompt)}</h2>` : `<button class="listen" data-act="speak" data-w="${esc(q.w.en)}" data-audio="${esc(q.w.audio||'')}" aria-label="Wort anhören">${ico('speaker',52,'stroke-width="2"')}</button>`)
        : `<h2 class="qprompt ${q.long?'long':''}">${esc(q.prompt)}</h2>`}

/* ============ Wortauswahl für eigene Tests / Lernsessions ============ */
const SEL = [['all','Alle'],['new','Neu'],['learn','Lernend'],['sure','Sicher'],['weak','Schwächste'],['recent','Zuletzt hinzugefügt']];
function custom(){ db.settings.custom = { kind:'test', sel:'all', n:10, dir:'mix', mode:'choice', front:'en', ...(db.settings.custom||{}) }; return db.settings.custom; }
function selectWords(sel, n){
  let ws = [...db.words];
  if(sel === 'new') ws = shuffle(ws.filter(w => !w.tested));
  else if(sel === 'learn') ws = shuffle(ws.filter(w => w.tested && w.box < 4));
  else if(sel === 'sure') ws = shuffle(ws.filter(w => w.tested && w.box >= 4));
  else if(sel === 'weak') ws = ws.sort((a,b) => a.box - b.box || (b.wrong - b.right) - (a.wrong - a.right) || Math.random() - .5);
  else if(sel === 'recent') ws = ws.sort((a,b) => b.created - a.created);
  else ws = shuffle(ws);
  ws = n ? ws.slice(0, n) : ws;
  return (sel === 'weak' || sel === 'recent') ? shuffle(ws) : ws;
}
function mistakeWords(){ return (db.mistakes||[]).map(id => db.words.find(w => w.id === id)).filter(Boolean); }

/* ============ Lernsession mit Vokabelzetteln ============ */
function startCards(words, front){
  if(!words.length){ toast('Keine passenden Wörter gefunden'); return; }
  const already = !!ui.cards;
  document.getElementById('toast').classList.remove('show');
  ui.cards = { words: words.map(w => w.id), queue: shuffle(words.map(w => w.id)), flipped:false, tries:{}, firstOk:{}, done:false, front: front || 'en' };
  if(!already) history.pushState({cards:true}, '');
  renderCards();
}
function closeCards(){ ui.cards = null; document.getElementById('overlay').innerHTML = ''; document.body.style.overflow = ''; render(); }
function cardAnswer(ok){
  const C = ui.cards; if(!C || C.done) return;
  const id = C.queue.shift(); if(!id) return;
  C.tries[id] = (C.tries[id]||0) + 1;
  if(ok){
    if(C.tries[id] === 1){
      C.firstOk[id] = true;
      const w = db.words.find(x => x.id === id);
      if(w && w.box < 3){ w.box++; save(); }   // Zettel zählen nur leicht: höchstens bis „Lernend“ 3/5
    }
  } else C.queue.splice(Math.min(C.queue.length, 3), 0, id);   // kommt in ein paar Karten wieder
  C.flipped = false;
  if(!C.queue.length){ C.done = true; touchStreak(); save(); }
  renderCards();
}
function renderCards(){
  const C = ui.cards, el = document.getElementById('overlay'); if(!C) return;

    const rows = C.words.map(id => db.words.find(w => w.id === id)).filter(Boolean).sort((a,b) => (C.tries[b.id]||0) - (C.tries[a.id]||0));

      <div class="ring">${first}/${total}</div>

      <div style="background:var(--dark2);border-radius:22px;padding:4px 16px">${rows.map(w => `<div class="resrow"><div><p style="font-weight:600">${esc(w.en)}</p><p class="small" style="color:var(--dark-muted)">${esc(w.de.join(', '))}</p></div><span class="small" style="font-weight:700;color:${C.tries[w.id] > 1 ? 'var(--amber)' : 'var(--good)'}">${C.tries[w.id] > 1 ? C.tries[w.id] + '× gesehen' : 'sofort'}</span></div>`).join('')}</div>
      <div style="flex:1"></div>
      <button class="btn full" style="height:52px;border-radius:26px;background:transparent;border:1.5px solid var(--amber);color:var(--amber)" data-act="cardsAgain">Nochmal alle</button>
      <button class="btn amber full" style="height:54px;border-radius:27px" data-act="cardsClose">Fertig</button>
    </div></div>`;
    return;
  }
  const w = db.words.find(x => x.id === C.queue[0]);
  if(!w){ C.queue.shift(); return renderCards(); }
  const frontEn = C.front !== 'de';
  const front = frontEn ? w.en : w.de.join(', '), back = frontEn ? w.de.join(', ') : w.en;
  el.innerHTML = `<div class="overlay"><div class="in">
    <div class="row between"><div class="row"><div class="bolt">${ico('list',18,'stroke-width="2"')}</div><p style="font-weight:600;font-size:14px">Lernsession</p></div>
      <button class="btn" style="height:44px;background:transparent;border:1px solid #44444C;font-size:14px" data-act="cardsClose">Beenden</button></div>
    <div class="stack" style="gap:8px"><div class="pbar"><i style="width:${Math.round(learned/total*100)}%"></i></div>
      <p class="small" style="color:var(--dark-muted)">${learned} von ${total} gelernt${C.tries[w.id] ? ` · diesen Zettel ${C.tries[w.id]}× gesehen` : ''}</p></div>
    <div id="zettel" class="zettel" role="button" tabindex="0" aria-label="${C.flipped ? 'Zettel-Rückseite' : 'Zettel umdrehen'}">
      <span class="stamp ok" aria-hidden="true">Gewusst</span><span class="stamp no" aria-hidden="true">Nochmal</span>
      ${C.flipped ? `
        <p class="small muted">${esc(front)}</p>
        <p style="font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.4px">${esc(back)}</p>
        ${frontEn ? '' : (w.ipa ? `<p class="muted">${esc(w.ipa)}</p>` : '')}
        ${w.ex ? `<div class="ctx" style="text-align:left;width:100%;margin-top:6px"><p class="small" style="font-weight:500;line-height:1.45">${esc(w.ex)}</p>${w.exDe ? `<p class="small muted" style="font-style:italic;line-height:1.45">${esc(w.exDe)}</p>` : ''}</div>` : ''}`
      : `
        <p style="font-size:36px;font-weight:700;line-height:1.15;letter-spacing:-.5px">${esc(front)}</p>
        ${frontEn && w.ipa ? `<p class="muted">${esc(w.ipa)}</p>` : ''}

      <button class="link" style="min-height:44px;display:flex;align-items:center;gap:6px" data-act="speak" data-w="${esc(w.en)}" data-audio="${esc(w.audio||'')}" aria-label="Englisch anhören">${ico('speaker',20)} anhören</button>
    </div>
    <div style="flex:1"></div>
    ${C.flipped ? `<div class="row" style="gap:10px">
        <button class="btn full again" style="height:54px" data-act="cardNo">Nochmal</button>
        <button class="btn full" style="height:54px;background:#1E4A31;border:1.5px solid var(--good)" data-act="cardOk">Gewusst</button></div>`
      : `<button class="btn amber full" style="height:54px;border-radius:27px" data-act="cardFlip">Umdrehen</button>`}
    <p class="small" style="color:var(--dark-muted);text-align:center">Wischen: nach rechts = gewusst, nach links = nochmal üben</p>
  </div></div>`;
  bindSwipe();
}
function bindSwipe(){
  const el = document.getElementById('zettel'); if(!el) return;
  const ok = el.querySelector('.stamp.ok'), no = el.querySelector('.stamp.no');
  let x0 = null, y0 = 0, dx = 0, moved = false;
  el.addEventListener('pointerdown', e => {
    if(e.target.closest('button')) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false; el.classList.add('drag');
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  });
  el.addEventListener('pointermove', e => {
    if(x0 === null) return;
    dx = e.clientX - x0;
    if(Math.abs(dx) > 8 || Math.abs(e.clientY - y0) > 8) moved = true;
    el.style.transform = `translateX(${dx}px) rotate(${dx/22}deg)`;
    ok.style.opacity = Math.max(0, Math.min(1, dx/90)); no.style.opacity = Math.max(0, Math.min(1, -dx/90));
  });
  const end = () => {
    if(x0 === null) return;
    x0 = null; el.classList.remove('drag');
    if(Math.abs(dx) > 90){ const d = dx > 0 ? 1 : -1; el.style.transform = `translateX(${d*520}px) rotate(${d*22}deg)`; setTimeout(() => cardAnswer(d > 0), 170); return; }
    el.style.transform = ''; ok.style.opacity = 0; no.style.opacity = 0;
    if(!moved){ ui.cards.flipped = !ui.cards.flipped; renderCards(); }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', () => { x0 = null; el.classList.remove('drag'); el.style.transform = ''; ok.style.opacity = 0; no.style.opacity = 0; });
  el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ui.cards.flipped = !ui.cards.flipped; renderCards(); } });
}

      if(!en){ toast('Bitte das englische Wort eintragen'); enIn.focus(); return; }
      if(findWord(en)){ toast(`„${en}“ ist schon in deiner Liste`); return; }
      if(norm(en) !== norm(d.en)) base = { ...emptyData(en) };  // selbst geändert: Wörterbuch-Daten passen nicht mehr
    }
    const w = makeWord({...base, de, exDe: ex && base === d ? ex.value.trim() : base.exDe});
    db.words.push(w); save(); syncNotifications(); toast(`„${w.en}“ gespeichert`);
    ui.lookup = null; render();
    const i = document.getElementById('wordIn'); if(i) i.focus();
  }
  if(e.target.id === 'deForm'){
    const w = db.words.find(x => x.id === ui.detail);
    const de = document.getElementById('deEdit').value.split(/[,;]/).map(s => s.trim()).filter(Boolean);
    if(w && de.length){ w.de = de; save(); }
    ui.editDe = false; render();
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ ui.q = e.target.value; document.getElementById('rows').innerHTML = wordRows(); }
  if(e.target.id === 'bkIn') bkCheck(e.target.value);
  if(e.target.dataset && e.target.dataset.qen){
    const q = (db.queue||[]).find(x => x.id === e.target.dataset.qen);
    if(q){ q.en = e.target.value; save(); const h = document.getElementById('qhead'); if(h) h.innerHTML = queueHead(); }
  }
  if(e.target.dataset && e.target.dataset.qde){
    const q = (db.queue||[]).find(x => x.id === e.target.dataset.qde);
    if(q){ q.deText = e.target.value; q.deTouched = true; save(); const h = document.getElementById('qhead'); if(h && !h.contains(document.activeElement)) h.innerHTML = queueHead(); }
  }
});
document.addEventListener('change', e => {
  if(e.target.id === 'tStart' || e.target.id === 'tEnd'){
    db.settings[e.target.id === 'tStart' ? 'start' : 'end'] = e.target.value || (e.target.id === 'tStart' ? '08:00' : '21:00');
    buildSchedule(); save(); render();
  }
  if(e.target.id === 'importFile' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => importBackup(r.result);
    r.readAsText(e.target.files[0]); e.target.value = '';
  }
});

function parseBackup(text){
  try{
    const j = JSON.parse(String(text||'').trim());
    if(!j || !Array.isArray(j.words)) return null;
    const words = j.words.filter(w => w && w.en);
    return { j, total: words.length, fresh: words.filter(w => !findWord(w.en)).length };
  }catch(e){ return null; }
}
function importBackup(text){
  try{
    const j = JSON.parse(String(text||'').trim()); if(!Array.isArray(j.words)) throw 0;
    let added = 0; j.words.forEach(w => { if(w && w.en && !findWord(w.en)){ db.words.push({...makeWord(w), ...w, id: w.id || uid()}); added++; } });
    if(j.settings) db.settings = {...DEFAULTS, ...j.settings, notify: db.settings.notify};
    save(); buildSchedule(); toast(`${added} Wörter importiert`); render();
  }catch(err){ toast('Das ist kein gültiges Backup'); }
}

/* ============ Zwischenablage ============ */
const CLIP = PLUG('Clipboard'), SHARE = PLUG('Share'), FS = PLUG('Filesystem');
async function copyText(t){ if(CLIP) return CLIP.write({ string:t }); return navigator.clipboard.writeText(t); }
async function readClip(){ if(CLIP){ const r = await CLIP.read(); return r && r.value || ''; } return navigator.clipboard.readText(); }

/* ============ Fenster (Modal) ============ */
function openModal(html){ const m = document.getElementById('modal'); m.innerHTML = `<div class="mbox">${html}</div>`; m.hidden = false; document.body.style.overflow = 'hidden'; }
function closeModal(){ const m = document.getElementById('modal'); m.hidden = true; m.innerHTML = ''; ui.modal = null; if(!ui.quiz && !ui.cards) document.body.style.overflow = ''; }
document.getElementById('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });

/* ============ Backup einfügen ============ */
function openBackupDialog(){
  ui.modal = 'backup'; ui.bkText = '';
  openModal(`<h2>Backup einfügen</h2>
    <p class="small muted" style="line-height:1.45">Füge den kopierten Backup-Text ein. Er wird nicht komplett angezeigt – die App prüft ihn für dich.</p>
    <button class="btn line full" data-act="bkPaste">Aus Zwischenablage einfügen</button>
    <label class="sr" for="bkIn">Backup-Text</label>
    <textarea id="bkIn" class="input bkin" rows="2" wrap="off" spellcheck="false" autocapitalize="none" autocomplete="off" placeholder="… oder hier lange drücken → Einfügen"></textarea>
    <div id="bkStatus" aria-live="polite"></div>
    <div class="row" style="gap:10px"><button class="btn line" data-act="modalClose">Abbrechen</button><button class="btn" style="flex:1" id="bkGo" data-act="bkImport" disabled>Importieren</button></div>`);
}
function bkCheck(text){
  ui.bkText = text;
  const r = parseBackup(text), st = document.getElementById('bkStatus'), go = document.getElementById('bkGo');
  if(!st) return;
  if(!String(text).trim()){ st.innerHTML = ''; go.disabled = true; return; }
  st.innerHTML = r ? `<p class="okline ok">${ico('check',18,'stroke-width="2.6"')} Gültiges Backup · ${r.total} Wörter, davon ${r.fresh} neu</p>`
                   : `<p class="okline bad">${ico('x',18,'stroke-width="2.6"')} Kein gültiges Backup</p>`;
  go.disabled = !r;
  if(r){ const i = document.getElementById('bkIn'); if(i) i.blur(); }   // Tastatur zu, Buttons bleiben sichtbar
}

/* ============ Teilen ============ */
function shareText(words){ return words.map(w => `${w.en} – ${w.de.join(', ')}`).join('\n'); }
const IMG_MAX = 30;
function drawShareImage(words, withStatus){
  const W = 1080, P = 64, F = (wt, sz, it) => `${it ? 'italic ' : ''}${wt} ${sz}px system-ui, -apple-system, Roboto, "Segoe UI", sans-serif`;
  const C = { bg:'#F4F3EF', card:'#FFFFFF', ink:'#18181C', muted:'#5C5D66', line:'#E3E1DA', accent:'#3442C4', soft:'#E7E9FB', aink:'#2A35A0' };
  const chipC = w => { const c = status(w)[1]; return c === 'new' ? ['#FCEFD2','#6B4500'] : c === 'sure' ? ['#DCF0E3','#1D5E38'] : ['#E7E9FB','#2A35A0']; };
  const meas = document.createElement('canvas').getContext('2d');
  const wrap = (t, font, maxW) => { meas.font = font; const out = []; let line = ''; for(const word of String(t).split(/\s+/)){ const test = line ? line + ' ' + word : word; if(meas.measureText(test).width > maxW && line){ out.push(line); line = word; } else line = test; } if(line) out.push(line); return out; };
  const fit = (t, font, maxW) => { meas.font = font; if(meas.measureText(t).width <= maxW) return t; while(t.length > 1 && meas.measureText(t + '…').width > maxW) t = t.slice(0, -1); return t + '…'; };
  const rr = (x, X, Y, w, h, r, fill) => { x.beginPath(); if(x.roundRect) x.roundRect(X, Y, w, h, r); else x.rect(X, Y, w, h); x.fillStyle = fill; x.fill(); };
  let yy = 0;   // Gesamthöhe: erst Befehle sammeln und messen, dann zeichnen
  const single = words.length === 1, inner = W - 2*P - 2*56, X0 = P + 56;
  const cmds = []; const add = f => cmds.push(f);
  if(single){
    const w = words[0]; let cy = P + 56;
    add(['card', P, P]);
    add(['t', 'VOKABEL', F(700, 28), C.muted, X0, cy + 28]); cy += 28 + 36;
    for(const l of wrap(w.en, F(800, 92), inner)){ add(['t', l, F(800, 92), C.ink, X0, cy + 80]); cy += 104; }
    const meta = [w.ipa, w.pos].filter(Boolean).join('  ·  ');
    if(meta){ add(['t', meta, F(400, 36), C.muted, X0, cy + 34]); cy += 60; }
    cy += 28; add(['t', 'DEUTSCH', F(700, 28), C.muted, X0, cy + 28]); cy += 28 + 24;
    for(const l of wrap(w.de.join(', '), F(700, 54), inner)){ add(['t', l, F(700, 54), C.aink, X0, cy + 48]); cy += 66; }
    if(w.ex){
      cy += 28; const exL = wrap(w.ex, F(500, 38), inner - 64), deL = w.exDe ? wrap(w.exDe, F(400, 34, true), inner - 64) : [];
      const h = 40 + exL.length*52 + (deL.length ? 12 + deL.length*46 : 0) + 32;
      add(['box', X0, cy, inner, h]); let by = cy + 40;
      for(const l of exL){ add(['t', l, F(500, 38), C.ink, X0 + 32, by + 34]); by += 52; }
      if(deL.length){ by += 12; for(const l of deL){ add(['t', l, F(400, 34, true), C.muted, X0 + 32, by + 30]); by += 46; } }
      cy += h;
    }
    if(withStatus){
      cy += 44; const [st] = status(w);
      add(['t', `Mein Lernstand: ${st} · ${w.box} von 5`, F(600, 34), C.ink, X0, cy + 32]); cy += 54;
      add(['bar', X0, cy, inner, 16, w.box/5]); cy += 16;
    }
    cy += 56; add(['cardEnd', cy]);
    add(['t', 'Vokabeltrainer EN–DE', F(500, 28), C.muted, W/2, cy + 64, 'center']);
    yy = cy + 64 + 48;
  } else {
    const shown = words.slice(0, IMG_MAX), more = words.length - shown.length;
    let cy = P;
    add(['t', 'Mein Lernfortschritt', F(800, 64), C.ink, P, cy + 58]); cy += 84;
    add(['t', `${words.length} Wörter`, F(500, 34), C.muted, P, cy + 30]); cy += 64;
    const cardTop = cy; add(['card', P, cardTop]); cy += 20;
    const chipW = 230, textW = inner - (withStatus ? chipW + 24 : 0);
    shown.forEach((w, i) => {
      cy += 26;
      add(['t', fit(w.en, F(700, 44), textW), F(700, 44), C.ink, X0, cy + 40]);
      if(withStatus){ const [st] = status(w), [bg, fg] = chipC(w); add(['chip', `${st} ${w.box}/5`, X0 + inner - chipW, cy + 2, chipW, 52, bg, fg]); }
      cy += 54;
      add(['t', fit(w.de.join(', '), F(400, 34), textW), F(400, 34), C.muted, X0, cy + 32]); cy += 46;
      cy += 22; if(i < shown.length - 1) add(['line', X0, cy, inner]);
    });
    if(more > 0){ cy += 26; add(['t', `… und ${more} weitere (siehe Text)`, F(600, 34), C.accent, X0, cy + 32]); cy += 58; }
    cy += 20; add(['cardEnd', cy]);
    add(['t', 'Vokabeltrainer EN–DE', F(500, 28), C.muted, W/2, cy + 64, 'center']);
    yy = cy + 64 + 48;
  }
  const cv = document.createElement('canvas'); cv.width = W; cv.height = Math.ceil(yy);
  const x = cv.getContext('2d'); x.fillStyle = C.bg; x.fillRect(0, 0, W, cv.height);
  let cardY = 0;
  for(const c of cmds){
    if(c[0] === 'card') cardY = c[2];
    else if(c[0] === 'cardEnd'){ x.save(); x.shadowColor = 'rgba(0,0,0,.08)'; x.shadowBlur = 30; x.shadowOffsetY = 8; rr(x, P, cardY, W - 2*P, c[1] - cardY, 48, C.card); x.restore(); }
  }
  for(const c of cmds){
    const k = c[0];
    if(k === 't'){ x.font = c[2]; x.fillStyle = c[3]; x.textAlign = c[6] || 'left'; x.fillText(c[1], c[4], c[5]); }
    else if(k === 'box') rr(x, c[1], c[2], c[3], c[4], 28, C.bg);
    else if(k === 'bar'){ rr(x, c[1], c[2], c[3], c[4], 8, '#ECEAE4'); if(c[5] > 0) rr(x, c[1], c[2], Math.max(16, c[3]*c[5]), c[4], 8, C.accent); }
    else if(k === 'line'){ x.fillStyle = '#ECEAE4'; x.fillRect(c[1], c[2], c[3], 2); }
    else if(k === 'chip'){ rr(x, c[2], c[3], c[4], c[5], 26, c[6]); x.font = F(700, 28); x.fillStyle = c[7]; x.textAlign = 'center'; x.fillText(c[1], c[2] + c[4]/2, c[3] + 36); }
  }
  return cv;
}
function shareWords(){ return (ui.share ? ui.share.ids : []).map(id => db.words.find(w => w.id === id)).filter(Boolean); }
function openShare(ids){
  ui.share = { ids, tab:'text' }; ui.modal = 'share';
  renderShare();
}
function renderShare(){
  const ws = shareWords(); if(!ws.length){ closeModal(); return; }
  const tab = ui.share.tab, n = ws.length;
  const tabs = `<div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <button data-act="shareTab" data-t="text" aria-pressed="${tab === 'text'}">Text</button>
      <button data-act="shareTab" data-t="img" aria-pressed="${tab === 'img'}">Lernfortschritt</button></div>`;
  let body;
  if(tab === 'text'){
    const t = shareText(ws);
    body = `<label class="sr" for="shareTxt">Vokabeln als Text</label>
      <textarea id="shareTxt" class="input" readonly rows="${Math.min(8, Math.max(2, n))}" style="font-size:15px;line-height:1.5;resize:none">${esc(t)}</textarea>
      <button class="btn full" style="height:52px;border-radius:26px" data-act="shareCopy">Kopieren</button>
      <button class="btn line full" data-act="shareTextGo">${ico('share',18,'style="vertical-align:-4px;margin-right:6px"')}Teilen …</button>`;
  } else {
    if(!ui.share.png) ui.share.png = drawShareImage(ws, true).toDataURL('image/png');
    body = `<img class="shareimg" src="${ui.share.png}" alt="Bild mit deinem Lernfortschritt">
      ${n > IMG_MAX ? `<p class="small muted">Das Bild zeigt die ersten ${IMG_MAX} Wörter.</p>` : ''}
      <button class="btn full" style="height:52px;border-radius:26px" data-act="shareImgGo">${ico('share',18,'style="vertical-align:-4px;margin-right:6px"')}Bild teilen</button>`;
  }
  openModal(`<div class="row between"><h2>${n === 1 ? `„${esc(ws[0].en)}“ teilen` : `${n} Vokabeln teilen`}</h2>
      <button class="link" style="color:var(--muted);display:flex;align-items:center" data-act="modalClose" aria-label="Schließen">${ico('x',22)}</button></div>
    ${tabs}${body}`);
}
async function shareAsText(){
  const t = shareText(shareWords());
  try{
    if(SHARE){ await SHARE.share({ text:t, dialogTitle:'Vokabeln teilen' }); return; }
    if(navigator.share){ await navigator.share({ text:t }); return; }
    await copyText(t); toast('Kopiert');
  }catch(e){ if(e && e.name !== 'AbortError' && !/cancel/i.test(String(e.message||e))) toast('Teilen hat nicht geklappt'); }
}
async function shareAsImage(){
  const url = ui.share.png, b64 = url.split(',')[1], name = `lernfortschritt-${Date.now()}.png`;
  try{
    if(SHARE && FS){
      const f = await FS.writeFile({ path:name, data:b64, directory:'CACHE' });
      await SHARE.share({ files:[f.uri], dialogTitle:'Lernfortschritt teilen' }); return;
    }
    const blob = await (await fetch(url)).blob(), file = new File([blob], name, { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; }
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast('Bild gespeichert');
  }catch(e){ if(e && e.name !== 'AbortError' && !/cancel/i.test(String(e.message||e))) toast('Teilen hat nicht geklappt'); }
}

/* ============ Mehrfachauswahl in der Vokabelliste ============ */
function startSel(id){
  ui.sel = [id]; ui.selDelArm = false;
  history.pushState({ screen:'words', sel:true }, '');
  try{ navigator.vibrate && navigator.vibrate(15); }catch(_){}
  render();
}
function endSel(){ if(history.state && history.state.sel) history.back(); else { ui.sel = null; render(); } }
function renderSelbar(){
  const bar = document.getElementById('selbar'), on = ui.screen === 'words' && ui.sel;
  bar.hidden = !on; if(!on) return;
  const n = ui.sel.length, dis = n ? '' : 'disabled';
  document.getElementById('selbarIn').innerHTML = `
    <button data-act="selShare" ${dis}>${ico('share',22)}Teilen</button>
    <button data-act="selCards" ${dis}>${ico('cards',22)}Üben</button>
    <button data-act="selTest" ${dis}>${ico('bolt',22)}Test</button>
    <button data-act="selDelete" class="${ui.selDelArm ? 'arm' : ''}" ${dis}>${ico('trash',22)}${ui.selDelArm ? 'Sicher?' : 'Löschen'}</button>`;
}
let lpTimer = null, lpXY = null;
document.addEventListener('pointerdown', e => {
  ui.lpFired = false;   // neue Berührung: ein evtl. verschluckter Klick vom langen Drücken zählt nicht mehr
  const row = e.target.closest('[data-lp]'); if(!row || ui.sel) return;
  lpXY = [e.clientX, e.clientY];
  lpTimer = setTimeout(() => { lpTimer = null; ui.lpFired = true; startSel(row.dataset.id); }, 450);
});
document.addEventListener('pointermove', e => { if(lpTimer && lpXY && Math.hypot(e.clientX - lpXY[0], e.clientY - lpXY[1]) > 10){ clearTimeout(lpTimer); lpTimer = null; } });
['pointerup','pointercancel'].forEach(t => document.addEventListener(t, () => { if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; } }));
document.addEventListener('contextmenu', e => { if(e.target.closest('[data-lp]')) e.preventDefault(); });

/* ============ Start ============ */
history.replaceState({screen:'home'}, '');
ensureSchedule();
render();
setInterval(checkDue, 30000);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ checkDue(); if(!ui.quiz) render(); } });
setTimeout(checkDue, 1500);
processQueue();
loadVersion().then(() => { if(!ui.quiz) render(); afterUpdateNotice(); countOpen(); });
if(NATIVE){
  // Beim ersten Start einmal um Erlaubnis für Benachrichtigungen fragen
  (async () => {
    if(!db.settings.askedNotify){
      db.settings.askedNotify = true;
      const p = await nativePermission(true); ui.perm = p;
      db.settings.notify = p === 'granted'; save();
    } else ui.perm = await nativePermission(false);
    syncNotifications();
  })();
  if(LN) LN.addListener('localNotificationActionPerformed', a => {
    if(a && a.notification && a.notification.extra && a.notification.extra.quiz && !ui.quiz && !ui.cards){ checkDue(); startQuiz(); }
  });
  if(APP){
    APP.addListener('backButton', ({canGoBack}) => {
      if(!document.getElementById('modal').hidden) closeModal();
      else if(document.getElementById('banner').classList.contains('show')) hideBanner();
      else if(canGoBack && (ui.quiz || ui.cards || ui.sel || ui.screen !== 'home')) history.back();
      else if(ui.screen !== 'home') go('home');
      else APP.exitApp();
    });
    APP.addListener('pause', () => { ui.pausedAt = Date.now(); appVisible = false; syncNotifications(); });
    APP.addListener('resume', () => {
      appVisible = true;
      checkDue(); syncNotifications(); resumeInstall();
      if(ui.pausedAt && Date.now() - ui.pausedAt >= AWAY_MIN * 60000) countOpen();
      ui.pausedAt = 0;
      if(!ui.quiz && !ui.cards && ui.modal !== 'update' && ui.modal !== 'share' && ui.modal !== 'backup') render();
    });
  }
}
if(!NATIVE && 'serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
