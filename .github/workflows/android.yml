name: Android-APK bauen

on:
  push:
    branches: [main, android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-App ins Android-Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk "Vokabeln-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Vokabeln-APK
          path: Vokabeln-*.apk

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vokabeln 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Vokabeln-*.apk
          body: |
            APK am Handy herunterladen und öffnen. Ein Update installiert sich einfach über die alte Version – deine Vokabeln bleiben erhalten.
