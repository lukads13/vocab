name: Android-APK bauen

on:
  push:
    branches: [main, android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Versionsinfo für die Update-Prüfung schreiben
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          node -e "require('fs').writeFileSync('www/build-info.js', 'window.BUILD_INFO = ' + JSON.stringify({ version: '1.0.' + process.env.GITHUB_RUN_NUMBER, repo: process.env.GITHUB_REPOSITORY, token: process.env.UPDATE_TOKEN || '' }) + ';\n')"

      - name: Web-App ins Android-Projekt kopieren
        run: npx cap sync android

      - name: Signierschlüssel aus den Secrets holen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PW" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64 und ANDROID_KEYSTORE_PASSWORD fehlen (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk "Vokabeln-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Vokabeln-APK
          path: Vokabeln-*.apk

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vokabeln 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Vokabeln-*.apk
          body: |
            APK am Handy herunterladen und öffnen. Ein Update installiert sich einfach über die alte Version – deine Vokabeln bleiben erhalten.
